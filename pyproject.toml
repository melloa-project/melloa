[build-system]
requires = ["editables==0.5", "hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "melloa"
version = "0.0.1"
description = "Owner-controlled runtime contracts and M0 foundation for Melloa"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
melloa = "melloa.apps.cli:main"

[dependency-groups]
build = [
  "editables==0.5",
  "hatchling==1.32.0",
]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
docs = [
  "mkdocs-material>=9.6,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/melloa"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=melloa --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
  "src/melloa/adapters/postgres/*",
  "src/melloa/ports/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106"]
"src/melloa/adapters/models/codex_cli.py" = ["S603"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["melloa"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
