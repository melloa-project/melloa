site_name: Melloa Architecture Specification
site_description: Research-backed architecture for a long-lived personal AI operating system
site_url: ""
repo_url: "https://github.com/melloa-project/melloa"
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - v0.2 adopted decisions: 23-v0.2-decisions.md
  - M0 implementation: 24-m0-implementation.md
