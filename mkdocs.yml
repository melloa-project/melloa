site_name: Melloa
site_description: Owner-controlled, local-first personal AI architecture and runtime
site_url: "https://melloa-project.github.io/melloa/"
repo_url: "https://github.com/melloa-project/melloa"
theme:
  name: material
  features:
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Start and use Melloa:
      - Start locally: getting-started.md
      - Configure advanced routes and state: run-current-mvp.md
      - Local operations: operations/current-mvp.md
      - Development and verification: development.md
