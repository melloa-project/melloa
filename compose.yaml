name: melloa

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: melloa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
    networks:
      - state
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d melloa"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

networks:
  state:
    internal: true

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ${MELLOA_POSTGRES_PASSWORD_FILE:?Set MELLOA_POSTGRES_PASSWORD_FILE to a mode-0600 file}
