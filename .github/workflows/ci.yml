name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install pinned Node.js line
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: make bootstrap
      - name: Run deterministic checks
        run: make check
      - name: Verify PostgreSQL contracts
        run: make integration
      - name: Prove persistent runtime, scheduled backup, and clean restore
        run: make server-runtime
      - name: Prove encrypted clean restore
        run: make recovery

  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install pinned Node.js line
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start public-fixture offline preview
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/melloa-mvp"
          setsid make preview \
            GUARDIAN_STATUS=tests/fixtures/guardian/offline-status.json \
            GUARDIAN_PUBLIC_KEY=tests/fixtures/guardian/public-key.pub \
            PREVIEW_STATE_DIR="$state" \
            > "$RUNNER_TEMP/melloa-preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/melloa-preview.pid"
          echo "MELLOA_OWNER_CREDENTIAL_FILE=$state/owner-credential" >> "$GITHUB_ENV"
          if ! curl --fail --silent --show-error --retry 60 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8787/ >/dev/null; then
            cat "$RUNNER_TEMP/melloa-preview.log" >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready >/dev/null
      - name: Install headless Chromium
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Capture the owner experience on desktop and mobile
        env:
          MELLOA_SCREENSHOT_DIR: ${{ runner.temp }}/melloa-screenshots
        run: npm --prefix apps/web run screenshots
      - name: Upload visual inspection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-experience-screenshots
          path: ${{ runner.temp }}/melloa-screenshots
          if-no-files-found: error
          retention-days: 14
      - name: Stop public-fixture preview
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/melloa-preview.pid"
          if [[ -s "$pid_file" ]]; then
            kill -- "-$(cat "$pid_file")" 2>/dev/null || true
          fi
          for _ in {1..20}; do
            [[ ! -e "$RUNNER_TEMP/melloa-mvp" ]] && exit 0
            sleep 0.25
          done
          echo "Preview state was not removed during shutdown" >&2
          exit 1
