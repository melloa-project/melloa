name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install pinned Node.js line
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: make bootstrap
      - name: Run deterministic checks
        run: make check
      - name: Verify PostgreSQL contracts
        run: make integration
      - name: Prove encrypted clean restore
        run: make recovery

  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out independent Guardian source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: melloa-project/melloa-guardian
          ref: 2006fef8b2f6deeed84da8ba8ccf03fb40672441
          path: .ci/melloa-guardian
      - name: Generate deterministic dependency SBOM
        run: |
          make sbom \
            GUARDIAN_ROOT=.ci/melloa-guardian \
            SBOM_OUTPUT="$RUNNER_TEMP/melloa-dependency-sbom.cdx.json"
          make sbom-check \
            GUARDIAN_ROOT=.ci/melloa-guardian \
            SBOM_OUTPUT="$RUNNER_TEMP/melloa-dependency-sbom.cdx.json"
      - name: Upload dependency SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-sbom
          path: ${{ runner.temp }}/melloa-dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install pinned Node.js line
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Go for independent Guardian fixture
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.24.x"
          cache-dependency-path: .ci/melloa-guardian/go.mod
      - name: Install locked application dependencies
        run: make bootstrap
      - name: Start canonical signed offline preview
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/melloa-mvp"
          setsid make preview \
            GUARDIAN_ROOT=.ci/melloa-guardian \
            PREVIEW_STATE_DIR="$state" \
            > "$RUNNER_TEMP/melloa-preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/melloa-preview.pid"
          echo "MELLOA_OWNER_CREDENTIAL_FILE=$state/owner-credential" >> "$GITHUB_ENV"
          if ! curl --fail --silent --show-error --retry 60 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8787/ >/dev/null; then
            cat "$RUNNER_TEMP/melloa-preview.log" >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready >/dev/null
      - name: Install headless Chromium
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Capture authenticated desktop and mobile states
        env:
          MELLOA_SCREENSHOT_DIR: ${{ runner.temp }}/melloa-screenshots
        run: npm --prefix apps/web run screenshots:mvp
      - name: Upload visual inspection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-mvp-screenshots
          path: ${{ runner.temp }}/melloa-screenshots
          if-no-files-found: error
          retention-days: 14
      - name: Stop canonical preview
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/melloa-preview.pid"
          if [[ -s "$pid_file" ]]; then
            kill -- "-$(cat "$pid_file")" 2>/dev/null || true
          fi
          for _ in {1..20}; do
            [[ ! -e "$RUNNER_TEMP/melloa-mvp" ]] && exit 0
            sleep 0.25
          done
          echo "Preview state was not removed during shutdown" >&2
          exit 1

  publish-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, visual-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install locked documentation dependencies
        run: make bootstrap-docs
      - name: Build strict documentation site
        run: make docs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
